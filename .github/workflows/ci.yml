name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # golangci-lint v2.13 is built with go1.26 and cannot decode the
          # export-data v5 that go1.27.2 emits; pin to 1.27.1 until a
          # golangci-lint built against go1.27.2 is released.
          go-version: '1.27.1'
          # no go.sum: the module has no dependencies
          cache-dependency-path: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          install-only: true
      - run: make ci
