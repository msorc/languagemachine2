name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # no go.sum: the module has no dependencies
          cache-dependency-path: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          install-only: true
      - run: make ci
